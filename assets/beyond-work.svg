<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img"><title>Beyond work</title><style>/* Hallmark v2.0.0 | redesign: full | theme: Console (1 of 3) | console: graphite | genre: modern-minimal | signature: portrait set into an engineering notebook */
