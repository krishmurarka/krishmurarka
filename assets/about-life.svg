<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 239" width="760" height="239" role="img">
<title>Engineering interests: full-stack AI, retrieval and access, and LLM evaluation</title>
<defs><pattern id="about-life-grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#3c547e" opacity=".38"/></pattern>
<linearGradient id="about-life-edge"><stop stop-color="#247bff"/><stop offset=".52" stop-color="#283b5a"/><stop offset="1" stop-color="#ff354f"/></linearGradient></defs>
<style>
.enter { animation: reveal .85s cubic-bezier(.2,.75,.25,1) both; transform-box:fill-box; }
@keyframes reveal { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.pulse{opacity:.75;animation:pulse 12s infinite}.p1{animation-delay:-8s}.p2{animation-delay:-4s}@keyframes pulse{0%,33%{opacity:1}36%,97%{opacity:.25}}
@media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
</style>
<rect x="1" y="1" width="758" height="237" rx="22" fill="#070b16" stroke="url(#about-life-edge)"/>
<rect x="15" y="15" width="730" height="209" rx="14" fill="url(#about-life-grid)" stroke="none"/>
<text x="38" y="58" fill="#f4f2eb" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="34">What I work on</text><rect x="38" y="86" width="216" height="124" rx="14" fill="#101b2d" stroke="#263f63"/><text x="52" y="120" fill="#79b4ff" font-family="Segoe UI,Arial,sans-serif" font-weight="650" font-size="21">Full-stack AI</text><text x="52" y="155" fill="#bac5d9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" font-size="16">From the interface to</text><text x="52" y="177" fill="#bac5d9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" font-size="16">the model-backed API.</text><rect x="52" y="192" width="53" height="3" fill="#ff6076" class="pulse p0"/><rect x="270" y="86" width="216" height="124" rx="14" fill="#101b2d" stroke="#263f63"/><text x="284" y="120" fill="#79b4ff" font-family="Segoe UI,Arial,sans-serif" font-weight="650" font-size="21">Retrieval and access</text><text x="284" y="155" fill="#bac5d9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" font-size="16">Ground answers in sources</text><text x="284" y="177" fill="#bac5d9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" font-size="16">users can access.</text><rect x="284" y="192" width="53" height="3" fill="#ff6076" class="pulse p1"/><rect x="502" y="86" width="216" height="124" rx="14" fill="#101b2d" stroke="#263f63"/><text x="516" y="120" fill="#79b4ff" font-family="Segoe UI,Arial,sans-serif" font-weight="650" font-size="21">LLM evaluation</text><text x="516" y="155" fill="#bac5d9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" font-size="16">Catch regressions before</text><text x="516" y="177" fill="#bac5d9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" font-size="16">they reach users.</text><rect x="516" y="192" width="53" height="3" fill="#ff6076" class="pulse p2"/>
</svg>
